<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Watchmetrics</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-6 py-12">
    <header class="text-center">
        <h1 class="text-4xl font-bold tracking-tight">Watchmetrics</h1>
        <p class="mt-4 text-slate-400">
            Explore how TV series evolved episode by episode — IMDb, Rotten Tomatoes, and Metacritic scores in one place.
        </p>
    </header>

    <section class="mt-10">
        <label for="search-input" class="sr-only">Search TV series</label>
        <div class="relative">
            <input id="search-input"
                   type="search"
                   name="q"
                   placeholder="Search TV series…"
                   autocomplete="off"
                   autofocus
                   th:value="${query}"
                   class="w-full rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 pr-12 text-slate-100 placeholder:text-slate-500 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/40"
                   hx-get="/"
                   hx-trigger="input changed delay:300ms"
                   hx-target="#search-results"
                   hx-indicator="#search-spinner"
                   hx-replace-url="true"/>
            <div id="search-spinner" class="htmx-indicator absolute inset-y-0 right-4 flex items-center">
                <svg class="h-5 w-5 animate-spin text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments/search-results :: results}"></div>
</main>
</body>
</html>
