<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <th:block th:replace="~{fragments/favicon :: link}"></th:block>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<main class="mx-auto max-w-3xl px-6 py-12 text-center">
    <a href="/" class="text-sm text-slate-400 transition hover:text-slate-200">&larr; Back to search</a>
    <h1 class="mt-6 text-3xl font-bold">Something went wrong</h1>
    <p class="mt-4 text-slate-400" th:text="${message}">Could not load series.</p>
</main>
</body>
</html>
