# Copy to the droplet:
#   sudo cp deploy/nginx-watchmetrics.conf /etc/nginx/sites-available/watchmetrics
#   sudo ln -sf /etc/nginx/sites-available/watchmetrics /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (after HTTP works):
#   sudo certbot --nginx -d watchmetrics.benceluzsinszky.com

server {
    listen 80;
    listen [::]:80;
    server_name watchmetrics.benceluzsinszky.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
